<circle cx="462.6" cy="330.0" r="8" fill="#1f5eff"/><text x="462.6" y="334.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="476.6" y="334.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="12" font-weight="400" fill="#414552" text-anchor="start">빌키삭제 응답</text>
