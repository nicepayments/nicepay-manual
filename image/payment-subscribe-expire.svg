<text x="380.0" y="155.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11.5" font-weight="400" fill="#414552" text-anchor="middle">빌키확정으로 저장한 빌키(bid)로 결제일마다 POST /v1/subscribe/{bid}/payments 호출</text>
