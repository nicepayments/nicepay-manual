<text x="86.0" y="197.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="10" font-weight="700" fill="#8792a2" text-anchor="middle">STEP 2</text>
<text x="124.0" y="198.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="13" font-weight="700" fill="#1a1f36" text-anchor="start">빌키삭제</text>
