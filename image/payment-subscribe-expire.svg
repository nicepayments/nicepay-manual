<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
<title>빌키삭제</title>
<rect width="1100" height="720" fill="#ffffff"/>
<rect x="180" y="100" width="60" height="560" rx="30" fill="#f7f7f7"/>
<text x="210" y="70" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="30" fill="#767676" text-anchor="middle">Client Browser</text>
<rect x="530" y="100" width="60" height="560" rx="30" fill="#f7f7f7"/>
<text x="560" y="70" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="30" fill="#767676" text-anchor="middle">Server</text>
<rect x="880" y="100" width="60" height="560" rx="30" fill="#f7f7f7"/>
<text x="910" y="70" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="30" fill="#767676" text-anchor="middle">Nicepay</text>
<rect x="170" y="126" width="150" height="34" rx="17" fill="#4064c3" opacity="0.1"/>
<text x="186" y="149" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#4064c3" text-anchor="start">STEP 1</text>
<text x="338" y="149" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#233976" text-anchor="start">빌키확정, 빌키승인</text>
<rect x="150" y="180" width="820" height="64" rx="16" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="560.0" y="220" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="17" font-weight="400" fill="#767676" text-anchor="middle">빌키확정으로 저장한 빌키(bid)로 결제일마다 POST /v1/subscribe/{bid}/payments 호출</text>
<rect x="170" y="276" width="150" height="34" rx="17" fill="#4064c3" opacity="0.1"/>
<text x="186" y="299" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#4064c3" text-anchor="start">STEP 2</text>
<text x="338" y="299" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#233976" text-anchor="start">빌키삭제</text>
<rect x="300" y="330" width="780" height="270" rx="22" fill="#f6f6f6" fill-opacity="0.4" stroke="#4064c3" stroke-width="3"/>
<text x="735.0" y="380" font-family="'SFMono-Regular',Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#233976" text-anchor="middle">POST /v1/subscribe/{bid}/expire</text>
<line x1="210" y1="410" x2="550" y2="410" stroke="#9e9e9e" stroke-width="2"/>
<polygon points="203,399 223.9,410 203,421" fill="#9e9e9e"/>
<polygon points="545,399 565.9,410 545,421" fill="#c1411a"/>
<text x="385.0" y="444" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#767676" text-anchor="middle">구독 해지 요청</text>
<line x1="560" y1="410" x2="900" y2="410" stroke="#9e9e9e" stroke-width="2"/>
<polygon points="895,399 915.9,410 895,421" fill="#233976"/>
<circle cx="590" cy="446" r="13" fill="#4064c3"/>
<text x="590" y="452" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="612" y="452" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#767676" text-anchor="start">빌키삭제 요청</text>
<path d="M918,410 C990,410 990,530 918,530" fill="none" stroke="#9e9e9e" stroke-width="2"/>
<text x="1018" y="466.0" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#767676" text-anchor="middle">삭제</text>
<text x="1018" y="492.0" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#767676" text-anchor="middle">처리</text>
<line x1="910" y1="530" x2="570" y2="530" stroke="#9e9e9e" stroke-width="2"/>
<polygon points="917,519 896.1,530 917,541" fill="#233976"/>
<polygon points="575,519 554.1,530 575,541" fill="#c1411a"/>
<circle cx="590" cy="566" r="13" fill="#4064c3"/>
<text x="590" y="572" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="612" y="572" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#767676" text-anchor="start">빌키삭제 응답</text>
<line x1="560" y1="630" x2="220" y2="630" stroke="#9e9e9e" stroke-width="2"/>
<polygon points="225,619 204.1,630 225,641" fill="#9e9e9e"/>
<polygon points="575,619 554.1,630 575,641" fill="#9e9e9e"/>
<text x="385.0" y="664" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#767676" text-anchor="middle">구독 해지 완료</text>
<text x="560.0" y="702" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-size="16" font-weight="400" fill="#9e9e9e" text-anchor="middle">삭제된 빌키(bid)는 복원과 빌키승인이 불가합니다</text>
</svg>
