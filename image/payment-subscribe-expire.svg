<text x="380.0" y="451.0" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="11.5" font-weight="400" fill="#8792a2" text-anchor="middle">삭제된 빌키(bid)는 복원과 빌키승인이 불가합니다</text>
