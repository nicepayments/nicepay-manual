    <script>
      (() => {
        const key = new URL("..", location).pathname + ".__palette";
        const palettes = {
          light: { index: 0, color: { media: "(prefers-color-scheme: light)", scheme: "default", primary: "custom", accent: "custom" } },
          dark: { index: 1, color: { media: "(prefers-color-scheme: dark)", scheme: "slate", primary: "custom", accent: "custom" } },
        };
        const storage = {
          get(name) {
            try { return localStorage.getItem(name); } catch (error) { return null; }
          },
          set(name, value) {
            try { localStorage.setItem(name, value); } catch (error) {}
          },
        };
        let mode = null;
        try {
          const palette = JSON.parse(storage.get(key));
          if (palette && palette.color) mode = palette.color.scheme === "slate" ? "dark" : "light";
        } catch (error) {}
        const scalarMode = storage.get("colorMode");
        if (mode) {
          storage.set("colorMode", mode);
        } else if (scalarMode === "dark" || scalarMode === "light") {
          mode = scalarMode;
          storage.set(key, JSON.stringify(palettes[mode]));
        } else {
          mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.body.classList.add(mode === "dark" ? "dark-mode" : "light-mode");
        window.siteTheme = {
          toggle() {
            const next = document.body.classList.contains("dark-mode") ? "light" : "dark";
            const scalarToggle = document.querySelector(".darklight-reference button[aria-pressed]");
            if (scalarToggle) {
              scalarToggle.click();
            } else {
              storage.set("colorMode", next);
              document.body.classList.toggle("dark-mode", next === "dark");
              document.body.classList.toggle("light-mode", next === "light");
            }
            storage.set(key, JSON.stringify(palettes[next]));
          },
        };
      })();
    </script>

    <script>
      (() => {
        const header = document.querySelector(".site-header");
        const toggle = header.querySelector("[data-theme-toggle]");
        const label = () => {
          const text = document.body.classList.contains("dark-mode") ? "라이트 모드로 전환" : "다크 모드로 전환";
          toggle.title = text;
          toggle.setAttribute("aria-label", text);
        };
        label();
        new MutationObserver(label).observe(document.body, { attributes: true, attributeFilter: ["class"] });
        toggle.addEventListener("click", () => window.siteTheme.toggle());
        header.querySelectorAll("[data-search-open]").forEach((button) =>
          button.addEventListener("click", () => {
            const placeholder = document.querySelector(".sidebar-search-placeholder");
            const target = placeholder && placeholder.closest("button");
            if (target) target.click();
          }),
        );
        try {
          const facts = JSON.parse(sessionStorage.getItem(new URL("..", location).pathname + ".__source"));
          const list = header.querySelector(".site-source__facts");
          for (const name of ["stars", "forks"]) {
            if (facts && facts[name] !== undefined) {
              const item = document.createElement("li");
              item.className = name;
              item.textContent = facts[name];
              list.append(item);
            }
          }
        } catch (error) {}
        const tabs = header.querySelector(".site-tabs");
        const current = tabs.querySelector(".current");
        tabs.scrollLeft = current.offsetLeft + current.offsetWidth + 16 - tabs.clientWidth;
      })();
    </script>
